image boot.vfat {
    vfat {
	files = {
	    "Image"
	}
    }
    size = 50M
}

image marvell-fw.img {
  file  {
    holes = {"(0; 64K)"}
  }
}

image hdimage.img {
  hdimage {
  }

  partition fw {
    image = "marvell-fw.img"
    in-partition-table = false
    offset = 0
  }

  partition boot {
    offset = 64M
    partition-type = 0xC
    image = "boot.vfat"
  }

  partition rootfs {
    partition-type = 0x83
    image = "rootfs.ext4"
  }
}
